<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking form</title>
    <link rel="stylesheet" href="Appointment Booking.css">
</head>
<body>
    <header><div class="navbar">
    <a class="start"><span class="logo"><b>   ♥︎ 🩺 ♥︎   CITY CARE HOSPITAL</span></b></a>
    <a href="index.html" class="start" target="_self">Home</a>
    <a href="departemnt.html" class="start" target="_self">Departments </a>
    <a href="booking.html" class="start" target="_self">Book Appointment</a>
    <button>Emergency? Call ☎ 123-456-789</button></div></header>
    <div id="navbar2"><b>BOOK YOUR APPOINTMENT</b>
    <span class="info">Fill in the form to schedule your visit</span></div>
    <div id="content">
        <form class="details">
            <div class="field">
            <label ><b>Full Name</b></label>
            <input type="text" placeholder="Enter your full name" id="name">
        </div>

        <div class="field">
            <label ><b>Date Of Birth</b></label>
            <input type="date">
        </div>
        <div class="field">
            <label><b>Phone Number</b></label>
            <input type="tel"></div>
        <div class="field">
            <label><b>Email</b></label>
            <input type="email">
        </div>
        <div class="field">
           <label><b>Department</b></label>
           <input type="text" placeholder="Enter your Department" id="dep">
        </div>
        <div class="field">
            <label ><b>Preferred Date</b></label>
            <input type="date">
        </div>
        <div class="field">
            <label ><b>Preferred Time</b></label>
            <input type="time">
        </div>
        <div class="field">
           <label><b>Reason for your visit</b></label>
           <input type="text" placeholder="Enter your reason" id="reason">
        </div>
        <button class="book"><b>BOOK APPOINTMENT</b></button>
        </form>
    </div>
    <footer>
    <div class="last">
        <div class="footertop">
        <div class="slogan">
           <a class="end"><span class="endlogo"><b>  ✚    CITY CARE HOSPITAL</span></b></a>
           <span class="eend">Better health,brighter future</span>
         </div>

    <a class="end">Emergency? Call ☎: 123-456-789</a></div>
    <div class="copyright">©2026 City Care Hospital</div>
    </div>
    </footer>
    

</body>
</html>
