<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Appointment Booking.css">
</head>
<body>
    <header><div class="navbar">
    <a><span class="logo"><b>  ✚    CITY CARE HOSPITAL</span></b></a>
    <a >Home</a>
    <a>Departments </a>
    <a>Book Appointment</a>
    <button>Emergency? Call ☎ 123-456-789</button></div></header>
    <div id="navbar2"><b>BOOK YOUR APPOINTMENT</b>
    <span class="info">Fill in the form to schedule your visit</span></div>
    <div id="content">
        <form class="details">
            <div class="field">
            <label ><b>Full Name</b></label>
            <input type="text" placeholder="Enter your full name" id="name">
        </div>

        <div class="field">
            <label ><b>Date Of Birth</b></label>
            <input type="date">
        </div>
        <div class="field">
            <label><b>Phone Number</b></label>
            <input type="tel"></div>
        <div class="field">
            <label><b>Email</b></label>
            <input type="email">
        </div>
        <div class="field">
           <label><b>Department</b></label>
           <input type="text" placeholder="Enter your Department" id="dep">
        </div>
        <div class="field">
            <label ><b>Preferred Date</b></label>
            <input type="date">
        </div>
        <div class="field">
            <label ><b>Preferred Time</b></label>
            <input type="time">
        </div>
        <div class="field">
           <label><b>Reason for your visit</b></label>
           <input type="text" placeholder="Enter your reason" id="reason">
        </div>
        <button class="book"><b>BOOK</b></button>
    </div>
</body>
</html>
