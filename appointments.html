
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Appointments - City Care Hospital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            color: rgb(3, 3, 74);
        }

        header {
            background: rgb(4, 4, 147);
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        header a:hover {
            text-decoration: underline;
        }

        .appointments-page {
            padding: 50px 5%;
            min-height: 70vh;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 35px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: linear-gradient(
                to right,
                #90cfef,
                #f9f9f9
            );
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th {
            background: rgb(4, 4, 147);
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            overflow-wrap: anywhere;
        }

        tbody tr:hover {
            background: #f2f8ff;
        }

        #message {
            text-align: center;
            margin-top: 25px;
            font-weight: bold;
        }

        .error {
            color: #b42318;
        }

        .success {
            color: #176b36;
        }

        .refresh-container {
            text-align: center;
            margin-top: 20px;
        }

        .refresh-btn {
            background: rgb(4, 4, 147);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 25px;
            font-size: 15px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: rgb(3, 3, 74);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        footer {
            background: rgb(4, 4, 147);
            color: white;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            h1 {
                font-size: 30px;
            }

            .appointments-page {
                padding: 30px 4%;
            }

            .table-container {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        ♥︎ 🩺 ♥︎ CITY CARE HOSPITAL
    </div>

    <a href="main.html">
        ← Back to Dashboard
    </a>
</header>

<main class="appointments-page">

    <h1>Booked Appointments</h1>

    <p class="description">
        View appointments booked through
        City Care Hospital.
    </p>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Date of Birth</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Preferred Date</th>
                    <th>Preferred Time</th>
                    <th>Reason</th>
                </tr>
            </thead>

            <tbody id="appointmentsBody">
            </tbody>
        </table>

    </div>

    <p id="message" role="status" aria-live="polite">
        Loading appointments...
    </p>

    <div class="refresh-container">
        <button
            type="button"
            class="refresh-btn"
            id="refreshBtn"
        >
            Refresh Appointments
        </button>
    </div>

</main>

<footer>
    <p>
        © 2026 City Care Hospital. All Rights Reserved.
    </p>
</footer>

<script>

    // Relative API URL works locally and on Render.
    const API_URL = "/api/appointments";

    const tableBody = document.getElementById(
        "appointmentsBody"
    );

    const message = document.getElementById(
        "message"
    );

    const refreshBtn = document.getElementById(
        "refreshBtn"
    );

    const fields = [
        "full_name",
        "date_of_birth",
        "phone",
        "email",
        "department",
        "preferred_date",
        "preferred_time",
        "reason"
    ];

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    async function loadAppointments() {

        refreshBtn.disabled = true;
        tableBody.replaceChildren();

        showMessage("Loading appointments...");

        try {

            const response = await fetch(API_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            });

            // The backend is running but access is restricted.
            if (response.status === 403) {
                showMessage(
                    "Appointment records are restricted. " +
                    "Administrator authentication is required.",
                    "error"
                );
                return;
            }

            if (response.status === 401) {
                showMessage(
                    "Please sign in as an administrator " +
                    "to view appointments.",
                    "error"
                );
                return;
            }

            if (response.status === 404) {
                showMessage(
                    "Appointment API was not found. " +
                    "Please check the backend route.",
                    "error"
                );
                return;
            }

            if (!response.ok) {
                throw new Error(
                    "HTTP error: " + response.status
                );
            }

            const appointments = await response.json();

            if (!Array.isArray(appointments)) {
                throw new Error(
                    "Unexpected response from backend"
                );
            }

            if (appointments.length === 0) {
                showMessage(
                    "No appointments have been booked yet."
                );
                return;
            }

            appointments.forEach(function(appointment) {

                const row = document.createElement("tr");

                fields.forEach(function(field) {

                    const cell = document.createElement("td");

                    // textContent prevents HTML injection.
                    cell.textContent =
                        appointment[field] ?? "";

                    row.appendChild(cell);
                });

                tableBody.appendChild(row);
            });

            showMessage(
                appointments.length +
                " appointment(s) found.",
                "success"
            );

        } catch (error) {

            console.error(
                "Error loading appointments:",
                error
            );

            showMessage(
                "Unable to load appointments. " +
                "Please try again later.",
                "error"
            );

        } finally {

            refreshBtn.disabled = false;

        }
    }

    // Load appointments when the page opens.
    loadAppointments();

    // Allow manual refresh.
    refreshBtn.addEventListener(
        "click",
        loadAppointments
    );

</script>

</body>
</html>
